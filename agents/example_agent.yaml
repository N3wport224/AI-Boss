name: churn_response_agent
tier: agent
entrypoint: agents.example_agent:ChurnResponseAgent
description: Decides and narrates a follow-up action based on the churn-risk insight.
enabled: true
inputs:
  - name: tone
    label: Tone
    type: select
    options: [professional, urgent, casual]
    default: professional
  - name: notify_slack
    label: Notify Slack channel
    type: toggle
    default: false
  - name: custom_note
    label: Custom note (use {signups}, {churn}, {revenue} to interpolate)
    type: template
    default: "Based on {signups} signups and {churn} churn events this period."
  - name: enable_handoff
    label: Hand off high-risk cases to escalation_agent
    type: toggle
    default: true
outputs:
  - name: agent_decision
    label: Agent Decision
  - name: handoff
    label: Escalation Handoff
